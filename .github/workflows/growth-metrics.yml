name: growth-metrics

# Snapshot hebdomadaire des métriques de croissance (stars, downloads npm, issues).
# Gratuit : GITHUB_TOKEN + API publique npm, aucune IA. Voir doc/hookstack/growth/metrics.md.

on:
  schedule:
    - cron: '0 8 * * 1' # chaque lundi 08:00 UTC
  workflow_dispatch: {} # déclenchement manuel possible

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture metrics snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .claude/skills/growth-coach/scripts/metrics.mjs

      # main est protégée (PR obligatoire) : on ne peut plus pousser directement.
      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- doc/hookstack/growth/metrics.log.ndjson; then
            echo "No metrics change to commit."
            exit 0
          fi
          BRANCH="chore/growth-metrics-sync"
          git checkout -B "$BRANCH"
          git add doc/hookstack/growth/metrics.log.ndjson
          git commit -m "chore(growth): weekly metrics snapshot"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --title "chore(growth): weekly metrics snapshot" \
              --body "Snapshot hebdomadaire régénéré automatiquement par \`.claude/skills/growth-coach/scripts/metrics.mjs\`." \
              --base main --head "$BRANCH"
          else
            echo "PR already open for $BRANCH — branch updated in place."
          fi
