name: CI

# Garde-fou qualité sur chaque PR / push :
#   - typecheck + tests unitaires avec gate de coverage (lignes/statements/branches
#     ≥ 80 %, fonctions ≥ 75 %) sur la surface unit-testée (.claude/hooks,
#     src/lib, src/store, packages/cli/bin/core.mjs)
#   - validate:registry : échoue si registry.json viole registry.schema.json
#     (champ requis manquant, énumération invalide, champ inconnu) ou si un hook
#     dogfoodé n'a pas de test unitaire (échapperait au gate de coverage)
#   - sync-hooks --check : échoue si registry.json a dérivé des .mjs sur disque
#     (les .mjs sont la source de vérité du code ; code_snippet en dérive)
#   - ci-check-content : liens relatifs cassés + images manquantes dans tous les .md/.mdx

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : ce workflow ne fait que checkout + install + test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — historique git complet requis par le « Hooks timeline drift
      # guard » : .claude/hooks-timeline.mjs dérive la date de premier ajout de chaque
      # hook via `git log --diff-filter=A`. Un clone superficiel (défaut) daterait tous
      # les hooks du dernier commit → faux positif de dérive.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Python pour les variantes .py des hooks (pytest). setup-python fournit un
      # Python non « externally-managed » (PEP 668) : pip install y fonctionne
      # directement, contrairement au python3 système du runner (ubuntu-latest).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage gate (≥ 80 %)
        run: pnpm test:coverage

      # Gate par hook individuel : chaque .claude/hooks/*.mjs doit avoir ≥ 80 % de
      # couverture lignes, hors liste d'exceptions héritée (scripts/check-hook-coverage.mjs).
      # Consomme coverage/coverage-summary.json généré à l'étape précédente.
      - name: Per-hook coverage gate (lines ≥ 80 %)
        run: node scripts/check-hook-coverage.mjs

      # Badge de coverage du README : le SVG commité et le bloc COVERAGE_BADGE doivent
      # refléter le summary généré ci-dessus (générateur déterministe, cf. hooks-timeline).
      - name: Coverage badge drift guard
        run: node scripts/coverage-badge.mjs --check

      - name: Unit tests (pytest — .py hook variants)
        run: |
          pip install pytest
          python3 -m pytest -q

      - name: Registry schema validation
        run: pnpm validate:registry

      - name: Python/JS test coverage parity
        # La variante Python de chaque hook (.py) doit être au moins aussi
        # testée que sa variante .mjs — cf. scripts/check-python-coverage-parity.mjs.
        # Garantit que les utilisateurs Python ont le même filet de sécurité
        # que les utilisateurs TypeScript/JS.
        run: pnpm check:python-parity

      - name: Registry sync drift guard
        run: node .claude/sync-hooks.mjs --check

      - name: Hooks timeline drift guard
        run: node .claude/hooks-timeline.mjs --check

      - name: OKF bundle conformance guard
        run: node scripts/okf.mjs validate --strict

      - name: Dead link & image check (full repo)
        run: node scripts/ci-check-content.mjs
