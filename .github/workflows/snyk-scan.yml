name: Snyk security scan

# Refreshes per-hook Snyk Code verdicts in registry.json. Runs OUR side so
# `npx hookstack-cli` stays token-free for end users. Manual + weekly only —
# kept off PR/push events so it never races publish-cli and never fails on
# forks that lack SNYK_TOKEN.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan hooks → registry verdicts
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          # Account-level tokens have no default org — target it explicitly.
          # Set repo variable SNYK_ORG to the org SLUG from app.snyk.io/org/<slug>
          # (not the display name). Empty when unset → Snyk uses the token default.
          SNYK_CFG_ORG: ${{ vars.SNYK_ORG }}
        run: node .claude/scan-snyk.mjs

      # main est protégée (PR obligatoire) : on ne peut plus pousser directement.
      - name: Open PR with refreshed verdicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet registry/registry.json; then
            echo "No verdict changes."
            exit 0
          fi
          BRANCH="chore/snyk-verdicts-sync"
          git checkout -B "$BRANCH"
          git add registry/registry.json
          git commit -m "chore(security): refresh Snyk verdicts"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --title "chore(security): refresh Snyk verdicts" \
              --body "Verdicts Snyk régénérés automatiquement par \`.claude/scan-snyk.mjs\` (job hebdomadaire)." \
              --base main --head "$BRANCH"
          else
            echo "PR already open for $BRANCH — branch updated in place."
          fi
